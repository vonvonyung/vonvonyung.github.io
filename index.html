<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据查询</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <script src="tailwind.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#225599',
                        secondary: '#3385ff',
                        tertiary: '#f2f2f2',
                    },
                    fontFamily: {
                        sans: ['Arial', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .search-shadow {
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }
            .btn-hover {
                @apply transition-all duration-200;
            }
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col">
    <div class="flex-grow flex flex-col items-center p-4 pt-48">
        <!-- Logo区域 -->
        <div class="mb-8 text-center w-full">
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-primary tracking-tight mx-auto max-w-2xl">数据查询</h1>
        </div>
        
        <!-- 搜索框区域 -->
        <div class="w-full max-w-2xl">
            <form id="searchForm" class="flex rounded-lg overflow-hidden search-shadow border border-gray-200 hover:border-secondary hover:search-shadow-lg transition-all duration-300">
                <div class="flex-grow relative">
                    <input type="text" id="searchInput" class="w-full h-14 px-4 py-2 text-lg focus:outline-none" placeholder="请输入搜索内容...">
                </div>
                <button type="submit" class="bg-secondary hover:bg-blue-600 text-white font-medium px-8 text-lg transition-all duration-300 flex items-center justify-center whitespace-nowrap">
                    <span>百度一下</span>
                </button>
            </form>
            
            <!-- 搜索提示 -->
            <p class="text-sm text-gray-500 mt-3 text-center">
                提示：搜索结果将限制在 <a href="https://hebeea.edu.cn" target="_blank" class="text-blue-600 hover:underline">hebeea.edu.cn</a> 网站内
            </p>
        </div>
        
        <!-- 搜索建议 -->
        <div id="suggestions" class="w-full max-w-2xl mt-2 bg-white rounded-b-lg shadow-lg border border-gray-200 hidden">
            <ul class="py-2"></ul>
        </div>
    </div>

    <script>
        // 处理搜索表单提交
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const searchValue = document.getElementById('searchInput').value.trim();
            if (searchValue) {
                // 构建搜索URL，将搜索词作为参数
                const searchUrl = `https://www.baidu.com/s?ie=UTF-8&wd=site:hebeea.edu.cn ${encodeURIComponent(searchValue)}`;
                // 打开搜索结果页面
                window.location.href = searchUrl;
            }
        });
        
        // 模拟搜索建议功能
        const searchInput = document.getElementById('searchInput');
        const suggestions = document.getElementById('suggestions');
        const suggestionsList = suggestions.querySelector('ul');
        
        searchInput.addEventListener('focus', showSuggestions);
        searchInput.addEventListener('input', showSuggestions);
        document.addEventListener('click', function(e) {
            if (!searchForm.contains(e.target)) {
                suggestions.classList.add('hidden');
            }
        });
        
        function showSuggestions() {
            const value = searchInput.value.trim();
            if (value.length < 2) {
                suggestions.classList.add('hidden');
                return;
            }
            
            // 模拟搜索建议数据
            const mockSuggestions = [
                '河北省教育厅最新通知',
                '河北高校招生政策',
                '河北省中小学开学时间',
                '河北教师资格证考试',
                '河北省教育厅官网'
            ].filter(item => item.toLowerCase().includes(value.toLowerCase()));
            
            if (mockSuggestions.length > 0) {
                suggestionsList.innerHTML = '';
                mockSuggestions.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-2 hover:bg-gray-100 cursor-pointer transition-colors';
                    li.textContent = item;
                    li.addEventListener('click', function() {
                        searchInput.value = item;
                        suggestions.classList.add('hidden');
                    });
                    suggestionsList.appendChild(li);
                });
                suggestions.classList.remove('hidden');
            } else {
                suggestions.classList.add('hidden');
            }
        }
    </script>


    </body></html>
